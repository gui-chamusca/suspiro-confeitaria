<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Suspirô Confeitaria</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Tela de Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <img src="assets/images/logo.png" alt="Suspirô" class="login-logo">
            <h1>Painel Administrativo</h1>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite a senha" required>
                </div>
                <button type="submit" class="login-btn">Entrar</button>
                <p class="login-hint">Senha padrão: suspiro2026</p>
            </form>
        </div>
    </div>

    <!-- Painel Admin -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <div class="header-content">
                <img src="assets/images/logo.png" alt="Suspirô" class="header-logo">
                <div class="header-info">
                    <h1>Gerenciar Cardápio</h1>
                    <p>Suspirô Confeitaria</p>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">Sair</button>
        </header>

        <main class="admin-main">
            <!-- Configurações -->
            <section class="config-section">
                <h2>Configurações</h2>
                <div class="config-grid">
                    <div class="config-item">
                        <label for="businessName">Nome do Negócio</label>
                        <input type="text" id="businessName" value="Suspirô Confeitaria">
                    </div>
                    <div class="config-item">
                        <label for="ownerName">Nome da Proprietária</label>
                        <input type="text" id="ownerName" value="Graci">
                    </div>
                    <div class="config-item">
                        <label for="whatsappNumber">Número WhatsApp</label>
                        <input type="text" id="whatsappNumber" value="5511972006824" placeholder="5511972006824">
                    </div>
                    <div class="config-item">
                        <label for="newPassword">Alterar Senha</label>
                        <input type="password" id="newPassword" placeholder="Nova senha">
                    </div>
                </div>
                <button class="save-config-btn" id="saveConfigBtn">Salvar Configurações</button>
            </section>

            <!-- Adicionar/Editar Item -->
            <section class="item-section">
                <h2 id="formTitle">Adicionar Novo Item</h2>
                <form class="item-form" id="itemForm">
                    <input type="hidden" id="itemId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemName">Nome do Item</label>
                            <input type="text" id="itemName" placeholder="Ex: Bolo de Cenoura" required>
                        </div>
                        <div class="form-group">
                            <label for="itemPrice">Preço (R$)</label>
                            <input type="number" id="itemPrice" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="itemDescription">Descrição</label>
                        <textarea id="itemDescription" rows="3" placeholder="Descrição simples do item" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="itemCategory">Categoria</label>
                        <select id="itemCategory" required>
                            <option value="Doces">Doces</option>
                            <option value="Bolos">Bolos</option>
                            <option value="Tortas">Tortas</option>
                            <option value="Cookies">Cookies</option>
                            <option value="Cupcakes">Cupcakes</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="itemImage">Imagem (JPEG)</label>
                        <div class="image-upload">
                            <input type="file" id="itemImage" accept="image/jpeg,image/png" class="file-input">
                            <label for="itemImage" class="file-label">
                                <span class="file-icon">📷</span>
                                <span class="file-text">Escolher imagem</span>
                            </label>
                        </div>
                        <div class="image-preview" id="imagePreview">
                            <img src="" alt="Preview" id="previewImg">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="itemAvailable" checked>
                            <span>Disponível no cardápio</span>
                        </label>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="save-item-btn" id="saveItemBtn">Adicionar Item</button>
                        <button type="button" class="cancel-btn" id="cancelBtn" style="display: none;">Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- Lista de Itens -->
            <section class="list-section">
                <h2>Cardápio Atual</h2>
                <div class="items-list" id="itemsList">
                    <!-- Itens serão inseridos via JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Confirmação -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Confirmar</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modalMessage">Tem certeza?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modalCancel">Cancelar</button>
                <button class="btn-confirm" id="modalConfirm">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
